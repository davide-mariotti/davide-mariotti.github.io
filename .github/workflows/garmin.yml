name: Garmin - aggiorna dati
# Ogni giorno aggiorna i dati Garmin di ogni atleta su Firestore (privati, dietro login), con tutta la storia.
# Il runner parte vuoto: publish.py --pull riprende quello che è già online, così fetch.py scarica solo le novità
# (ultimi giorni e dettagli delle attività mancanti, al massimo 400 per giro: il primo caricamento può richiedere più giri).
# Secrets: GARMIN_KEY_<NOME_COGNOME> per atleta + FIREBASE_SERVICE_ACCOUNT. Un atleta senza chiave valida viene saltato.
on:
  schedule:
    - cron: '30 4 * * *'   # 4:30 UTC = 5:30/6:30 in Italia
  workflow_dispatch:
permissions:
  contents: read
concurrency: garmin
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { athlete: davide-mariotti, key: GARMIN_KEY_DAVIDE_MARIOTTI }
          - { athlete: andrea-prosperi, key: GARMIN_KEY_ANDREA_PROSPERI }
    defaults:
      run:
        working-directory: garmin
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: garmin
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: garmin/requirements.txt
      - run: pip install -r requirements.txt
      - name: Scarica da Garmin e pubblica su Firestore
        env:
          GARMIN_KEY: ${{ secrets[matrix.key] }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ ${#GARMIN_KEY} -lt 20 ]; then echo "Secret ${{ matrix.key }} mancante o segnaposto: salto."; exit 0; fi
          python publish.py --pull ${{ matrix.athlete }}
          python fetch.py --athlete ${{ matrix.athlete }}
          python publish.py ${{ matrix.athlete }}
